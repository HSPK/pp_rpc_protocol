[project]
name = "pp-rpc-protocol"
version = "0.1.0"
description = "Transport-neutral CBOR protocol for remote pi sessions (Python port of @earendil-works/pi-protocol)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Earendil Works" }]
maintainers = [{ name = "Hangxing Wei", email = "HSPK@users.noreply.github.com" }]
keywords = ["pi", "protocol", "cbor", "binary", "framing", "rpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.23",
]

[project.urls]
Homepage = "https://github.com/HSPK/pp_rpc_protocol"
Repository = "https://github.com/HSPK/pp_rpc_protocol"
Issues = "https://github.com/HSPK/pp_rpc_protocol/issues"
Upstream = "https://github.com/earendil-works/pi/tree/main/packages/protocol"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_protocol"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `-n auto` matters: the suite is dominated by tests that wait (real
# `asyncio.sleep` for OAuth device-code polling, retry backoff, subprocess
# timeouts), so wall time was ~2.5x CPU time when run serially. Override
# with `-n0` to debug a single test.
addopts = "-q -n auto"
filterwarnings = ["error::DeprecationWarning:pi_.*"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
